# Static landing page for the bare domain techupi.id.
# Install as /etc/nginx/sites-available/techupi.id and symlink it into
# sites-enabled. It only matches techupi.id and www.techupi.id, so the
# subdomain apps (archim, arsys, clab, iot-clab, programee, fetnet, ...)
# keep their own server blocks untouched.
#
# After enabling, run: sudo certbot --nginx -d techupi.id -d www.techupi.id
# Certbot adds the "listen 443 ssl" lines and certificate paths here.

server {
    listen 80;
    listen [::]:80;
    server_name techupi.id www.techupi.id;

    root /var/www/techupi.id;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
