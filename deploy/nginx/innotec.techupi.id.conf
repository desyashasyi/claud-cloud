# Static Hugo site for the InnoTec research group.
# Install as /etc/nginx/sites-available/innotec.techupi.id and symlink it into
# sites-enabled. It only matches innotec.techupi.id, so other sites are untouched.
#
# After enabling, run: sudo certbot --nginx -d innotec.techupi.id
# Certbot adds the "listen 443 ssl" lines and certificate paths here.

server {
    listen 80;
    listen [::]:80;
    server_name innotec.techupi.id;

    root /var/www/innotec;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;

    location ~ /\. {
        deny all;
    }
}
