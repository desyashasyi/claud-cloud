# Catch-all for host names that have no server block of their own.
#
# Without this, Nginx answers an unknown host (for example a new subdomain
# whose HTTPS is not set up yet) with the first server block that listens
# on 443, which on this server is ArsipM. With this file, such requests
# are closed instead, and every existing site keeps working because it
# matches its own server_name.
#
# Install as /etc/nginx/sites-available/00-default-catchall, symlink it into
# sites-enabled, then run: sudo nginx -t && sudo systemctl reload nginx
#
# Needs a certificate for the 443 listener. It uses Ubuntu's self-signed
# "snakeoil" certificate (package ssl-cert). Visitors never see it, because
# the connection is closed with 444 right away; Cloudflare shows its own
# error page instead.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    access_log off;
    return 444;
}
