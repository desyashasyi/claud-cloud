name: Deploy landing page to techupi.id

on:
  push:
    branches:
      - main
      - claude/revisi-tampilkan-screenshot-4oc643
    paths:
      - index.html
      - screenshots/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-techupi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Missing repository secrets:$missing"
            echo "ssh=false" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ssh=true" >> "$GITHUB_OUTPUT"
          if [ -z "$VPS_PATH" ]; then
            echo "::warning::VPS_PATH is not set. Running a read-only check to find the techupi.id web root; nothing will be uploaded."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.check.outputs.ssh == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Normalize the pasted key: drop Windows line endings, and rebuild
          # the line breaks if the whole key was pasted as one line.
          key=$(printf '%s' "$VPS_SSH_KEY" | tr -d '\r')
          if [ "$(printf '%s\n' "$key" | wc -l)" -le 1 ]; then
            header=$(printf '%s' "$key" | grep -oE -- '-----BEGIN [A-Z ]+-----' || true)
            footer=$(printf '%s' "$key" | grep -oE -- '-----END [A-Z ]+-----' || true)
            body=${key#*"$header"}
            body=${body%"$footer"*}
            key=$(printf '%s\n' "$header"; printf '%s' "$body" | tr -s ' ' '\n' | sed '/^$/d'; printf '%s\n' "$footer")
          fi
          printf '%s\n' "$key" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null; then
            echo "::error::VPS_SSH_KEY is not a valid private key. Paste the full contents of the .pem file, including the -----BEGIN ... PRIVATE KEY----- and -----END ... PRIVATE KEY----- lines. A .ppk (PuTTY) file must be converted first: puttygen key.ppk -O private-openssh -o key.pem"
            exit 1
          fi
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            if ! ssh-keyscan -T 15 -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts || [ ! -s ~/.ssh/known_hosts ]; then
              echo "::error::Cannot reach SSH on VPS_HOST port ${VPS_PORT:-22}. If VPS_HOST is a domain proxied by Cloudflare (orange cloud), use the server's IP address instead. Also check that the firewall allows SSH from the internet and that VPS_PORT is right."
              exit 1
            fi
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Find the techupi.id web root (read-only)
        if: steps.check.outputs.ssh == 'true' && steps.check.outputs.ready != 'true'
        run: |
          ssh vps 'echo "Connected as $(whoami) on $(hostname)"
            echo "--- web root candidates for techupi.id ---"
            for dir in /etc/nginx /etc/apache2 /etc/httpd /etc/caddy; do
              [ -d "$dir" ] || continue
              grep -rIl "techupi\.id" "$dir" 2>/dev/null | while read -r f; do
                echo "# $f"
                grep -nE "server_name|ServerName|ServerAlias|root|DocumentRoot|proxy_pass|reverse_proxy|techupi\.id" "$f"
              done
            done
            echo "--- folders in /var/www ---"
            ls -la /var/www 2>/dev/null || echo "(no /var/www)"
            echo "--- docker containers ---"
            docker ps --format "{{.Names}}  {{.Image}}  {{.Ports}}" 2>/dev/null || echo "(docker not available to this user)"
            echo "--- done ---"'
          echo "::notice::Copy the root/DocumentRoot folder for techupi.id above into the VPS_PATH secret, then run this workflow again."

      - name: Back up the current landing page
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh vps "set -e
            stamp=\$(date +%Y%m%d-%H%M%S)
            backup=\"\$HOME/techupi-backups/\$stamp\"
            mkdir -p \"\$backup\"
            cd '$VPS_PATH'
            [ -f index.html ] && cp -a index.html \"\$backup/\" || true
            [ -d screenshots ] && cp -a screenshots \"\$backup/\" || true
            echo \"Backup saved to \$backup\""

      - name: Upload new landing page
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -avz -e ssh index.html "vps:$VPS_PATH/index.html"
          rsync -avz -e ssh screenshots/ "vps:$VPS_PATH/screenshots/"
