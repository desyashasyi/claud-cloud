name: Deploy landing page to techupi.id

on:
  push:
    branches:
      - main
      - claude/revisi-tampilkan-screenshot-4oc643
    paths:
      - index.html
      - screenshots/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-techupi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_PATH: ${{ secrets.VPS_PATH }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - name: Check deploy secrets
        id: check
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_PATH VPS_SSH_KEY; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Missing repository secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Set up SSH
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts
          fi
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port ${VPS_PORT:-22}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
          EOF

      - name: Back up the current landing page
        if: steps.check.outputs.ready == 'true'
        run: |
          ssh vps "set -e
            stamp=\$(date +%Y%m%d-%H%M%S)
            backup=\"\$HOME/techupi-backups/\$stamp\"
            mkdir -p \"\$backup\"
            cd '$VPS_PATH'
            [ -f index.html ] && cp -a index.html \"\$backup/\" || true
            [ -d screenshots ] && cp -a screenshots \"\$backup/\" || true
            echo \"Backup saved to \$backup\""

      - name: Upload new landing page
        if: steps.check.outputs.ready == 'true'
        run: |
          rsync -avz -e ssh index.html "vps:$VPS_PATH/index.html"
          rsync -avz -e ssh screenshots/ "vps:$VPS_PATH/screenshots/"
