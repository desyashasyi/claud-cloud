{{ define "main" }}
<div class="masthead compact">
  {{ partial "signal.html" . }}
  <div class="wrap">
    <p class="eyebrow">{{ .Section | humanize }}{{ if eq .Section "news" }} · {{ .Date.Format "2 January 2006" }}{{ end }}</p>
    <h1 class="page-title">{{ .Title }}</h1>
  </div>
</div>
<main class="wrap"><article class="prose">{{ .Content }}</article></main>
{{ end }}
